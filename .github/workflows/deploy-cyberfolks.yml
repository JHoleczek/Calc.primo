# Publikacja kalkulatora na hostingu cyber_folks (FTP) – wersja z własną wysyłką zapytań (api/wyslij.php).
# Uruchamia się przy pushu, ale wgrywa pliki tylko wtedy, gdy w repozytorium są ustawione sekrety FTP
# (Settings → Secrets and variables → Actions): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR.
name: Deploy na cyber_folks

on:
  push:
    branches: [claude/bent-front-calculator-yent1s]
  workflow_dispatch:

concurrency:
  group: cyberfolks
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Sprawdzenie skryptów PHP
        run: for f in public/api/*.php; do php -l "$f"; done
      # Ścieżki względne – działa w dowolnym katalogu (np. /kalkulator/); formularz wysyła do api/wyslij.php.
      - run: npx tsc -b && npx vite build --base=./
      - name: Brak sekretów FTP – pomijam wgrywanie
        if: env.HAS_FTP != 'true'
        run: echo "Ustaw sekrety FTP_SERVER, FTP_USERNAME, FTP_PASSWORD i FTP_DIR, aby wgrywać na cyber_folks."
      # lftp: szyfrowane FTP (FTPS), bez usuwania plików na serwerze (dane zapytań w api/data zostają).
      # Błędy połączenia trafiają do adnotacji przebiegu, żeby było widać przyczynę bez pobierania logów.
      - name: Wgranie przez FTPS
        if: env.HAS_FTP == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          # Hasło tylko w zmiennej środowiskowej (lftp --env-password) – bez wstawiania do polecenia.
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Konto FTP startuje od razu w katalogu kalkulatora (primomeble.pl/kalkulator), więc cel to „/”.
          TARGET: /
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq lftp > /dev/null
          set +e
          ftp() {
            lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes;
              set ftp:passive-mode true; set net:timeout 20; set net:max-retries 2; set net:reconnect-interval-base 5;
              open --env-password -u \"$FTP_USERNAME\" ftp://$FTP_SERVER; $1"
          }
          ftp "debug 3; mirror --reverse --verbose --parallel=3 --exclude-glob api/data/ dist/ $TARGET" > lftp.log 2>&1
          code=$?
          cat lftp.log
          if [ $code -ne 0 ]; then
            grep -E '\*\*\*\*|<---|Fatal|refused|timed out|certificate|Login' lftp.log | grep -v PASS | head -n 20 | sed 's/^/::error::/'
            exit $code
          fi
          echo "::notice::Wgrano $(grep -c 'Transferring file' lftp.log) plików"
          # Sprzątanie po wcześniejszym wgrywaniu do złej ścieżki (kopia w kalkulator/domains/…).
          ftp "rm -r -f ${TARGET}domains" > /dev/null 2>&1
          # Kontrola: czy strona na żywo podaje właśnie wgraną wersję.
          sleep 5
          live=$(curl -s -H 'Cache-Control: no-cache' "https://primomeble.pl/kalkulator/?v=$GITHUB_RUN_ID" | grep -o 'assets/index-[^"]*\.js' | head -1)
          built=$(grep -o 'assets/index-[^"]*\.js' dist/index.html)
          if [ "$live" = "$built" ]; then
            echo "::notice::Na żywo: nowa wersja ($built)"
          else
            echo "::error::Na żywo jest inna wersja ($live) niż wgrana ($built)"
            exit 1
          fi
