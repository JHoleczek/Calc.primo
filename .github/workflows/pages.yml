# Publikacja kalkulatora na GitHub Pages przy każdym pushu na gałąź domyślną.
name: Deploy na GitHub Pages

on:
  push:
    branches: [claude/bent-front-calculator-yent1s]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Ścieżki względne – strona działa pod /Calc.primo/ bez dodatkowej konfiguracji.
      - run: npx tsc -b && npx vite build --base=./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
